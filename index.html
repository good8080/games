<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172a">
  <title>Make-a-Game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10172a;
      --surface: #1b2540;
      --ink: #f4f6ff;
      --muted: #bec8e3;
      --accent: #9ee493;
      --line: #364361;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at top, #26355a 0, var(--bg) 58%);
      color: var(--ink);
    }

    main {
      width: min(100% - 2rem, 54rem);
      margin: 0 auto;
      padding: 4rem 0 3rem;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .85rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: .4rem 0 1rem;
      font-size: clamp(2.6rem, 10vw, 5rem);
      line-height: 1;
    }

    .intro {
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.65;
    }

    h2 { margin-top: 3rem; }

    .game-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
      gap: 1rem;
      padding: 0;
      list-style: none;
    }

    .game-card, .empty-card {
      min-height: 8rem;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
    }

    .game-card a {
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration-color: var(--accent);
      text-underline-offset: .2em;
    }

    .empty-card { color: var(--muted); }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: .95rem;
    }

    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little game workshop</p>
    <h1>Make a game!</h1>
    <p class="intro">
      Pick an idea, build it with Copilot, and learn how the code works as you
      play. Every great game starts with a first version.
    </p>

    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Games to play</h2>
      <ul class="game-list">
        <li class="game-card">
          <a href="./games/ridge-runner.html">Ridge Runner</a>
          <p>Pedal, jump, and fly across huge mountain gaps on your bike.</p>
        </li>
      </ul>
    </section>

    <footer>
      <a href="./RECIPE.md">How to make a game</a>
    </footer>
  </main>
</body>
</html>
